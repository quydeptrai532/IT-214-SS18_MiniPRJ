server:
  port: 8081
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rikkeibank_identity?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # Mật khẩu mặc định khớp docker-compose. MySQL cài sẵn trên máy thì truyền DB_PASSWORD.
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
logging:
  level:
    com.rikkeibank.identity: DEBUG
