server:
  port: 8888
spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - optional:file:../config-repo
            - optional:file:./config-repo
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    com.rikkeibank: INFO
